name: Bygg och publicera (Windows; Linux och macOS vid behov)

# Bygger native på respektive runner via matrix (inte cross-compile från en maskin).
# Push till main (utom rena .md-ändringar) bygger Windows, html-zippen och den fristående html-filen.
# Linux och macOS byggs bara med "Run workflow" och plattformar = alla.
#
# Med offlinekartan är varje plattformsfil runt 1,5 GB. Varje bygge laddar därför upp
# sina filer direkt till releasen (som utkast) i stället för att samla allt i ett jobb,
# och releasen publiceras när alla byggen är klara. Release-texten finns i
# .github/release-notes.md; releasen får bara sin egen versions avsnitt och nedladdningen.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/images/**'
  workflow_dispatch:
    inputs:
      plattformar:
        description: 'Vilka appar som byggs: windows, eller alla (också Linux och macOS)'
        type: choice
        options: [windows, alla]
        default: windows
      edge:
        description: 'Edge-proven: kort (den fristående filen med IntranetFileLinksEnabled) eller alla (också html-versionen med JIT blockerad, förstärkt säkerhet och låst Edge, cirka en timme)'
        type: choice
        options: [kort, alla]
        default: kort

permissions:
  contents: write

# Två snabba pushar får inte bygga mot samma release samtidigt. Nästa körning väntar.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Läs version från Toolbox.html
        id: version
        run: node scripts/sync-version.js
      - name: Välj plattformar
        id: matrix
        env:
          PLATTFORMAR: ${{ github.event.inputs.plattformar || 'windows' }}
        run: |
          if [ "$PLATTFORMAR" = "alla" ]; then
            echo 'matrix={"include":[{"os":"windows-latest","platform":"win"},{"os":"ubuntu-latest","platform":"linux"},{"os":"macos-latest","platform":"mac"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"windows-latest","platform":"win"}]}' >> "$GITHUB_OUTPUT"
          fi

  # Kör före bygget så att en trasig hash- eller avkodningslogik aldrig når en release.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts hoppar över postinstall, som annars laddar ner Electron
      # i onödan; testerna använder bara Nodes inbyggda moduler.
      - name: Installera beroenden
        run: npm ci --ignore-scripts
      - name: Kör enhetstester
        run: npm test

  # Röktestet startar appen i Electron utan skärm och kör verktygen mot påhittade data (tests/app).
  # Ett eget jobb som inte stoppar releasen, tills det har visat sig stabilt i CI. Facit-testerna
  # kräver labbzippen och körs bara lokalt (npm run test:app).
  apptest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installera beroenden
        run: npm ci --ignore-scripts
      - name: Hämta Electron
        run: node scripts/ensure-electron.js
      - name: Kör röktestet i appen
        run: npm run test:app -- --smoke

  # Edge på Windows, som html-versionen körs utan skrivbordsappen: under file:// och utan internet. Bara när en ny
  # release byggs (versionen höjd) eller med "Run workflow", inte vid vanliga pushar: Windows-minuter räknas dubbelt.
  # Då bara den fristående html-filen med IntranetFileLinksEnabled (cirka fyra minuter), policyn som stoppade
  # html-versionens verktyg på hanterade datorer. Med "Run workflow" och edge = alla körs också html-versionen utan
  # policy, med JIT blockerad, med förstärkt säkerhet och i en Edge som bara når lokala filer (cirka en timme).
  # Provet skriver ut vad edge://policy säger, och hur fort WebAssembly går. Ett eget jobb som inte stoppar releasen.
  # Varje steg körs även om ett före det misslyckades.
  htmltest:
    needs: [prepare]
    if: needs.prepare.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installera beroenden
        run: npm ci --ignore-scripts
      - name: Kör html-versionen i Edge
        if: ${{ github.event.inputs.edge == 'alla' }}
        run: npm run test:html -- --browser edge
      - name: Kör den fristående html-filen i Edge
        if: ${{ !cancelled() && github.event.inputs.edge == 'alla' }}
        run: npm run test:html -- --browser edge --standalone --only-plain
      - name: Blockera JIT med policyn
        if: ${{ !cancelled() && github.event.inputs.edge == 'alla' }}
        shell: pwsh
        run: |
          $edge = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $edge -Force | Out-Null
          New-ItemProperty -Path $edge -Name 'DefaultJavaScriptJitSetting' -Value 2 -PropertyType DWord -Force | Out-Null
      - name: Kör html-versionen med JIT blockerad
        if: ${{ !cancelled() && github.event.inputs.edge == 'alla' }}
        run: npm run test:html -- --browser edge --only-plain --show-policy
      - name: Slå på förstärkt säkerhet med policyn
        if: ${{ !cancelled() && github.event.inputs.edge == 'alla' }}
        shell: pwsh
        run: |
          $edge = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          Remove-ItemProperty -Path $edge -Name 'DefaultJavaScriptJitSetting'
          New-ItemProperty -Path $edge -Name 'EnhanceSecurityMode' -Value 2 -PropertyType DWord -Force | Out-Null
      - name: Kör html-versionen med förstärkt säkerhet
        if: ${{ !cancelled() && github.event.inputs.edge == 'alla' }}
        run: npm run test:html -- --browser edge --only-plain --show-policy
      - name: Lås Edge till lokala filer
        if: ${{ !cancelled() && github.event.inputs.edge == 'alla' }}
        shell: pwsh
        run: |
          $edge = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          Remove-ItemProperty -Path $edge -Name 'EnhanceSecurityMode'
          New-Item -Path "$edge\URLBlocklist" -Force | Out-Null
          New-ItemProperty -Path "$edge\URLBlocklist" -Name '1' -Value '*' -PropertyType String -Force | Out-Null
          New-Item -Path "$edge\URLAllowlist" -Force | Out-Null
          New-ItemProperty -Path "$edge\URLAllowlist" -Name '1' -Value 'file://*' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "$edge\URLAllowlist" -Name '2' -Value 'edge://*' -PropertyType String -Force | Out-Null
      - name: Kör html-versionen i den låsta Edge
        if: ${{ !cancelled() && github.event.inputs.edge == 'alla' }}
        run: npm run test:html -- --browser edge --only-plain --expect-blocked --show-policy
      # Edge på en del hanterade datorer: IntranetFileLinksEnabled stoppar file://-navigeringar som sidan startar, så
      # html-versionens verktyg laddas inte. Den fristående filen ska fungera ändå. Den vanliga körs för att visa att
      # policyn biter här; att den misslyckas stoppar inget.
      - name: Slå på IntranetFileLinksEnabled med policyn
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $edge = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $edge -Force | Out-Null
          Remove-Item -Path "$edge\URLBlocklist" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$edge\URLAllowlist" -Recurse -Force -ErrorAction SilentlyContinue
          New-ItemProperty -Path $edge -Name 'IntranetFileLinksEnabled' -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Den vanliga html-versionen med IntranetFileLinksEnabled (väntas misslyckas)
        if: ${{ !cancelled() && github.event.inputs.edge == 'alla' }}
        continue-on-error: true
        run: npm run test:html -- --browser edge --only-plain --show-policy
      - name: Den fristående html-filen med IntranetFileLinksEnabled
        if: ${{ !cancelled() }}
        run: npm run test:html -- --browser edge --standalone --only-plain --show-policy

  # Skapar releasen som utkast, eller rensar ett befintligt utkast. En redan publicerad
  # release rörs inte: då hoppas bygget över. Höj versionen i Toolbox.html för en ny release.
  prepare:
    needs: [version, test]
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Skapa eller återställ release-utkast
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          MAPS=$(node -p "require('./maps/kartdata.json').release")
          # Bara den här versionens avsnitt och nedladdningen, inte hela historiken (scripts/release-notes.js).
          node scripts/release-notes.js "$VERSION" "$GITHUB_SHA" "$MAPS" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "::notice::$TAG är redan publicerad och lämnas orörd. Höj versionen för en ny release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release edit "$TAG" --title "Forensics Toolbox $VERSION" --notes-file notes.md
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              echo "Tar bort tidigare fil: $name"
              gh release delete-asset "$TAG" "$name" --yes
            done
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Forensics Toolbox $VERSION" --notes-file notes.md
          fi

  build:
    needs: [version, prepare]
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cacha electron-builder (Windows)
        if: matrix.platform == 'win'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Cacha electron-builder (Unix)
        if: matrix.platform != 'win'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Installera beroenden
        run: npm ci

      - name: Hämta offlinekartor (kontrollerar SHA-256)
        run: node scripts/fetch-map-data.js

      - name: Synka version
        run: npm run sync-version

      - name: Bygg Windows
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx electron-builder --win --publish never
          node scripts/finalize-artifacts.js

      - name: Bygg Linux (AppImage)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --linux AppImage --publish never

      - name: Bygg macOS (ad hoc-signerat DMG + ZIP, utan certifikat från Apple)
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --mac --publish never

      - name: Ladda upp till releasen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.AppImage release/*.dmg release/*-Portable.zip release/*-x64.zip release/*-arm64.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "Inga release-filer"; exit 1; fi
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  # Html-zippen (med offlinekartan) och den fristående html-filen, utan Electron. Körs vid varje release.
  html:
    needs: [version, prepare]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hämta offlinekartor (kontrollerar SHA-256)
        run: node scripts/fetch-map-data.js
      - name: Packa HTML-mapp (utan exe)
        run: node scripts/pack-html-folder.js
      - name: Bygg den fristående html-filen
        run: node scripts/build-standalone.js
      - name: Ladda upp till releasen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          ls -la release/*-html.zip release/*-en-fil.html
          gh release upload "$TAG" release/*-html.zip release/*-en-fil.html --clobber

  publish:
    needs: [version, prepare, build, html]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicera releasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.version.outputs.version }}"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'
          gh release edit "$TAG" --draft=false --latest
