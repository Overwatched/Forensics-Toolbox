<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioner</title>
    <script src="../_shared/toolkit.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../_shared/map/map.css">
</head>
<body>
    <div id="container">
        <header class="page-header">
            <h1>Positioner</h1>
            <p>Karta och rutt från GPX, KML, CSV, GeoJSON och Google-tidslinje. Allt läses lokalt.</p>
        </header>
        <div class="workspace">
            <aside class="side">
                <section class="side-block">
                    <h2>Lägg till</h2>
                    <button type="button" id="pick" class="primary-btn">Lägg till källa…</button>
                    <button type="button" id="fill-sample" class="secondary-btn">Fyll med testdata</button>
                    <input type="file" id="file" multiple hidden>
                    <label class="field" for="paste">Klistra in koordinater</label>
                    <textarea id="paste" rows="3" placeholder="59.3293, 18.0686 2024-06-01 14:00"></textarea>
                    <button type="button" id="paste-add" class="secondary-btn">Lägg till inklistrad text</button>
                    <section id="columns" class="columns display-none"></section>
                    <p id="status" class="status"></p>
                </section>

                <section class="side-block">
                    <h2>Tidsspann</h2>
                    <label class="field" for="time-from-date">Från</label>
                    <input type="text" id="time-from-date" placeholder="ÅÅÅÅ-MM-DD" maxlength="10" inputmode="numeric" autocomplete="off">
                    <input type="text" id="time-from-time" placeholder="TT:MM" maxlength="5" inputmode="numeric" aria-label="Från tid" autocomplete="off">
                    <label class="field" for="time-to-date">Till</label>
                    <input type="text" id="time-to-date" placeholder="ÅÅÅÅ-MM-DD" maxlength="10" inputmode="numeric" autocomplete="off">
                    <input type="text" id="time-to-time" placeholder="TT:MM" maxlength="5" inputmode="numeric" aria-label="Till tid" autocomplete="off">
                </section>

                <section class="side-block sources">
                    <h2>Källor</h2>
                    <div id="layer-list"></div>
                    <div id="manual" class="manual display-none">
                        <p id="manual-where"></p>
                        <input id="manual-name" type="text" placeholder="Etikett">
                        <label class="field" for="manual-date">Tid, om den finns</label>
                        <input id="manual-date" type="text" placeholder="ÅÅÅÅ-MM-DD" maxlength="10" inputmode="numeric" autocomplete="off">
                        <input id="manual-time" type="text" placeholder="TT:MM" maxlength="5" inputmode="numeric" aria-label="Tidpunkt" autocomplete="off">
                        <button type="button" id="manual-add" class="secondary-btn">Lägg till punkt här</button>
                    </div>
                </section>

                <section class="side-block exports">
                    <h2>Exportera det som visas</h2>
                    <button type="button" data-export="kml" class="secondary-btn">KML<span>Google Earth</span></button>
                    <button type="button" data-export="gpx" class="secondary-btn">GPX<span>GPS-spår</span></button>
                    <button type="button" data-export="geojson" class="secondary-btn">GeoJSON<span>QGIS och kartprogram</span></button>
                    <button type="button" data-export="csv" class="secondary-btn">CSV<span>Tabell</span></button>
                </section>
            </aside>
            <div id="map-host"></div>
        </div>
    </div>
    <script src="../_shared/map/sample-data.js"></script>
    <script src="../_shared/map/map-core.js"></script>
    <script src="../_shared/map/import-core.js"></script>
    <script src="../_shared/map/map-view.js"></script>
    <script src="script.js"></script>
</body>
</html>
