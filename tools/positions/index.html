<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioner</title>
    <script src="../_shared/toolkit.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../_shared/map/map.css">
    <link rel="stylesheet" href="../_shared/map/vendor/maps/maplibre-gl.css">
</head>
<body>
    <div id="container">
        <header class="page-header">
            <h1>Positioner</h1>
            <p>Karta och rutt från GPX, KML, CSV, GeoJSON och Google-tidslinje. Allt läses lokalt.</p>
        </header>
        <div class="workspace">
            <aside class="side">
                <section class="side-block sources">
                    <h2>Källor</h2>
                    <button type="button" id="pick" class="primary-btn">Lägg till källa…</button>
                    <input type="file" id="file" multiple hidden>
                    <section id="columns" class="columns display-none"></section>
                    <p id="status" class="status"></p>
                    <div id="layer-list"></div>
                    <div id="manual" class="manual display-none">
                        <p id="manual-where"></p>
                        <input id="manual-name" type="text" placeholder="Etikett">
                        <label class="field" for="manual-date">Tid, om den finns</label>
                        <input id="manual-date" type="text" placeholder="ÅÅÅÅ-MM-DD" maxlength="10" inputmode="numeric" autocomplete="off">
                        <input id="manual-time" type="text" placeholder="TT:MM" maxlength="5" inputmode="numeric" aria-label="Tidpunkt" autocomplete="off">
                        <button type="button" id="manual-add" class="secondary-btn">Lägg till punkt här</button>
                    </div>
                    <details class="side-more">
                        <summary>Klistra in koordinater</summary>
                        <textarea id="paste" rows="3" placeholder="59.3293, 18.0686 2024-06-01 14:00" aria-label="Koordinater"></textarea>
                        <button type="button" id="paste-add" class="secondary-btn">Lägg till inklistrad text</button>
                    </details>
                    <button type="button" id="fill-sample" class="link-btn side-link">Fyll med testdata</button>
                </section>

                <section class="side-block" id="time-block">
                    <h2>Tidsspann</h2>
                    <p class="zone-note">Klockslaget som det står i källan, ingen omräkning.</p>
                    <div class="time-row">
                        <label class="field" for="time-from-date">Från</label>
                        <input type="text" id="time-from-date" class="date-field" placeholder="ÅÅÅÅ-MM-DD" maxlength="10" inputmode="numeric" autocomplete="off">
                        <input type="text" id="time-from-time" class="time-field" placeholder="TT:MM" maxlength="5" inputmode="numeric" aria-label="Från tid" autocomplete="off">
                    </div>
                    <div class="time-row">
                        <label class="field" for="time-to-date">Till</label>
                        <input type="text" id="time-to-date" class="date-field" placeholder="ÅÅÅÅ-MM-DD" maxlength="10" inputmode="numeric" autocomplete="off">
                        <input type="text" id="time-to-time" class="time-field" placeholder="TT:MM" maxlength="5" inputmode="numeric" aria-label="Till tid" autocomplete="off">
                    </div>
                </section>

                <section class="side-block" id="routes-block">
                    <h2>Namngivna rutter</h2>
                    <div class="route-add">
                        <label class="field" for="route-from">Punkter</label>
                        <div class="route-span">
                            <input id="route-from" type="text" inputmode="numeric" maxlength="6" aria-label="Första punkten" autocomplete="off">
                            <span>–</span>
                            <input id="route-to" type="text" inputmode="numeric" maxlength="6" aria-label="Sista punkten" autocomplete="off">
                            <button type="button" id="route-add" class="secondary-btn">Lägg till</button>
                        </div>
                    </div>
                    <p id="route-error" class="status"></p>
                    <div id="route-list"></div>
                </section>

                <section class="side-block exports">
                    <h2>Spara och exportera</h2>
                    <div class="btn-row">
                        <button type="button" id="view-save" class="secondary-btn" title="Källor, färger, namngivna rutter, bubblor och kartläge sparas i en fil. Bilder följer med som små miniatyrer.">Spara vy…</button>
                        <button type="button" id="view-open" class="secondary-btn">Öppna vy…</button>
                    </div>
                    <input type="file" id="view-file" accept=".json,application/json" hidden>
                    <p class="field">Exportera det som visas:</p>
                    <div class="btn-row">
                        <button type="button" data-export="kml" class="secondary-btn" title="Google Earth">KML</button>
                        <button type="button" data-export="gpx" class="secondary-btn" title="GPS-spår">GPX</button>
                        <button type="button" data-export="geojson" class="secondary-btn" title="QGIS och kartprogram">GeoJSON</button>
                        <button type="button" data-export="csv" class="secondary-btn" title="Tabell">CSV</button>
                    </div>
                </section>
            </aside>
            <div id="map-host"></div>
        </div>
    </div>
    <script src="../_shared/map/sample-jpegs.js"></script>
    <script src="../_shared/map/sample-data.js"></script>
    <script src="../_shared/map/map-core.js"></script>
    <script src="../_shared/map/import-core.js"></script>
    <script src="../_shared/map/vendor/maps/maplibre.js"></script>
    <script src="../_shared/map/vendor/maps/map-assets.js"></script>
    <script src="../_shared/map/map-view.js"></script>
    <script src="script.js"></script>
</body>
</html>
