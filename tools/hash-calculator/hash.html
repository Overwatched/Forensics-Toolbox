<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Calculator</title>
    <script>
        (function () {
            try {
                var params = new URLSearchParams(location.search);
                var fromParent = params.get('theme');
                var saved = localStorage.getItem('theme');
                var theme = (fromParent === 'light' || fromParent === 'dark') ? fromParent
                    : (saved === 'light' || saved === 'dark') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                if (fromParent === 'light' || fromParent === 'dark') {
                    localStorage.setItem('theme', fromParent);
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <header class="page-header">
            <h1>Hash Calculator</h1>
            <p>Beräkna MD5, SHA-1 och SHA-256 lokalt</p>
        </header>

        <div class="tabs">
            <button type="button" class="tab active" data-mode="text">Text</button>
            <button type="button" class="tab" data-mode="file">Fil</button>
        </div>

        <div id="text-panel" class="panel">
            <textarea id="text-input" spellcheck="false" placeholder="Klistra in text här..."></textarea>
        </div>

        <div id="file-panel" class="panel display-none">
            <label class="file-drop" for="file-input">
                <span id="file-label">Välj en fil eller dra hit</span>
                <input id="file-input" type="file">
            </label>
        </div>

        <div class="button-row">
            <button id="hash-button" type="button">Beräkna</button>
            <button id="clear-button" class="secondary" type="button">Rensa</button>
        </div>

        <div id="status">Ingen data laddad</div>

        <div id="results" class="results display-none">
            <div class="result-row">
                <span class="algo">MD5</span>
                <code id="md5-out"></code>
                <button type="button" class="copy-btn" data-target="md5-out">Kopiera</button>
            </div>
            <div class="result-row">
                <span class="algo">SHA-1</span>
                <code id="sha1-out"></code>
                <button type="button" class="copy-btn" data-target="sha1-out">Kopiera</button>
            </div>
            <div class="result-row">
                <span class="algo">SHA-256</span>
                <code id="sha256-out"></code>
                <button type="button" class="copy-btn" data-target="sha256-out">Kopiera</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Kopierat</div>
    <script src="script.js"></script>
</body>

</html>
