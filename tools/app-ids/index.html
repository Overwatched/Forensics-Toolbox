<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App-ID</title>
    <script src="../_shared/toolkit.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <header class="page-header">
            <h1>App-ID</h1>
            <p>Sök på namn, paket eller bundle-id. iOS-id är lästa ur iTunes lookup för App Store-id, land SE.
                En sideload eller fork kan ha ett annat id.</p>
        </header>

        <div class="toolbar">
            <label class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" />
                    <path d="M16 16L20.5 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <input id="app-search" type="search" placeholder="Sök signal, whatsapp, com.whatsapp…" autocomplete="off" spellcheck="false">
            </label>
            <label class="type-filter">
                <span>Typ</span>
                <select id="app-category"></select>
            </label>
            <button type="button" id="export-csv">Exportera CSV</button>
        </div>

        <div id="app-catalog"></div>
        <p id="empty-state" class="empty display-none">Ingen app matchade sökningen.</p>
    </div>

    <div id="toast" class="toast">Kopierat</div>
    <script src="catalog.js"></script>
    <script src="script.js"></script>
</body>

</html>
